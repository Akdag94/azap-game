# XcodeGen proje tanımı — Mac'siz derleme için CI'da .xcodeproj bunu kullanarak üretilir
# (macOS'ta manuel kullanım: brew install xcodegen && cd ios && xcodegen generate)
name: AzapOnline
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  AzapOnline:
    type: application
    platform: iOS
    sources:
      - path: AzapOnline
        excludes:
          - "WebAssets"
      # Gömülü web istemcisi — folder reference (mavi klasör) olarak paketlenir
      - path: AzapOnline/WebAssets
        type: folder
        buildPhase: resources
    info:
      path: AzapOnline/Info.plist
      properties:
        CFBundleDisplayName: AZAP Online
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        UIViewControllerBasedStatusBarAppearance: false
        NSMicrophoneUsageDescription: "AZAP, oyun içi sesli sohbet için mikrofonunuza erişir."
        # Profil fotoğrafı / şikâyet ekran görüntüsü yüklenirken web görünümündeki
        # <input type="file" accept="image/*"> iOS'ta "Take Photo" ve "Photo Library"
        # seçeneklerini açar. Bu anahtarlar OLMADAN iOS uygulamayı anında sonlandırır
        # (TCC ihlali — App Store 2.1(a) reddi bu yüzden geldi).
        NSCameraUsageDescription: "AZAP, profil fotoğrafı çekmek ve şikâyet bildirimine görüntü eklemek için kameranıza erişir."
        NSPhotoLibraryUsageDescription: "AZAP, profil fotoğrafı ve şikâyet görüntüsü seçebilmeniz için fotoğraflarınıza erişir."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: AzapOnline/AzapOnline.entitlements
      properties:
        aps-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: online.azap.app
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.9"
